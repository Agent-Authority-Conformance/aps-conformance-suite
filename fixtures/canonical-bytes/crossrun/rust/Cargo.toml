[package]
name = "canonical-bytes-crossrun"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "canonical-bytes-crossrun"
path = "src/main.rs"

[dependencies]
# Exact published version from crates.io. No path dependency and no git
# dependency on a sibling checkout: a report that depended on a working tree on
# one machine would not be reproducible by anyone cloning this suite.
agent-passport-system = "=0.1.0"
serde_json = "=1.0.145"
sha2 = "=0.10.9"
hex = "=0.4.3"
